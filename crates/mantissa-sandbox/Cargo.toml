[package]
name = "mantissa-sandbox"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
publish = false
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mantissa = { path = "../.." }
# The helper applies policies without accessing the system keyring.
nono = { version = "0.80.0", default-features = false }
thiserror = "2.0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mantissa-sandbox-init"
path = "src/bin/mantissa-sandbox-init.rs"
test = false
bench = false
