[package]
name = "mantissa-volume"
version = "0.4.0"
edition = "2024"
license.workspace = true
description = "Replicated block-volume application for Mantissa"

[lints]
workspace = true

[dependencies]
async-channel = "2.5.0"
async-trait = "0.1.88"
arc-swap = "1.6"
blake3 = "1"
bytes = "1"
capnp = { workspace = true }
futures = "0.3.31"
libc = "0.2"
mantissa-protocol = { path = "../mantissa-protocol" }
mantissa-raft = { path = "../mantissa-raft" }
nix = { version = "0.29", default-features = false, features = ["fs", "mount"] }
openraft = { workspace = true }
parking_lot = { workspace = true }
redb = "4.1.0"
smol = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
devicemapper = { version = "=0.34.8", features = ["disable_cargo_metadata"] }
libublk = "=0.4.6"

[dev-dependencies]
capnp-rpc = { workspace = true }
mantissa-net = { path = "../mantissa-net" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
