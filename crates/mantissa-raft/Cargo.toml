[package]
name = "mantissa-raft"
version = "0.4.0"
edition = "2024"
license.workspace = true
description = "Generic typed consensus for Mantissa applications"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.88"
blake3 = "1"
capnp = { workspace = true }
capnp-rpc = { workspace = true }
chacha20poly1305 = "0.10.1"
getrandom = "0.2"
futures = "0.3.31"
mantissa-net = { path = "../mantissa-net" }
mantissa-protocol = { path = "../mantissa-protocol" }
openraft = { workspace = true }
parking_lot = { workspace = true }
redb = "4.1.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
